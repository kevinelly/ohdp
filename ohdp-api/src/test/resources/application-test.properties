spring.datasource.url=jdbc:h2:mem:dsf_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

dsf.auth.enabled=false
dsf.auth.bootstrap-admin-enabled=false

radiology.storage.base-dir=./target/test-radiology-storage
radiology.storage.max-upload-bytes=5242880
ohdp.reference-document.storage-dir=./target/test-reference-document-storage
ohdp.reference-document.max-upload-bytes=5242880
feedback.storage.base-dir=./target/test-feedback-storage
feedback.storage.max-upload-bytes=2097152
