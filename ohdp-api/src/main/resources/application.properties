spring.application.name=ohdp-api
server.port=18080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ohdp?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ohdp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

dsf.auth.enabled=true
dsf.auth.token-hours=${DSF_AUTH_TOKEN_HOURS:12}
dsf.auth.remember-token-hours=${DSF_AUTH_REMEMBER_TOKEN_HOURS:720}
dsf.auth.initial-password=${DSF_AUTH_INITIAL_PASSWORD:ChangeMe-Immediately}
dsf.auth.bootstrap-admin-enabled=true
dsf.auth.bootstrap-admin-username=${DSF_AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

ohdp.report.storage-dir=${OHDP_REPORT_STORAGE_DIR:./storage/reports}
ohdp.reference-document.storage-dir=${OHDP_REFERENCE_DOCUMENT_STORAGE_DIR:./storage/reference-documents}
ohdp.reference-document.max-upload-bytes=52428800

radiology.storage.base-dir=${RADIOLOGY_STORAGE_DIR:./storage/radiology}
radiology.storage.max-upload-bytes=26214400
feedback.storage.base-dir=${FEEDBACK_STORAGE_DIR:./storage/feedback}
feedback.storage.max-upload-bytes=10485760
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
