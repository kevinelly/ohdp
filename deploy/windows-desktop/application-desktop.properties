# Values are provided by the desktop launcher. No machine-specific paths.
server.address=127.0.0.1
server.port=${BHFYZX_PORT:18788}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=jdbc:h2:file:${BHFYZX_DATA_HOME}/database/ohdp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${BHFYZX_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=
spring.jpa.hibernate.ddl-auto=update
spring.web.resources.static-locations=${BHFYZX_WEB_URI}
dsf.auth.bootstrap-admin-username=admin
dsf.auth.initial-password=Test@345
dsf.auth.bootstrap-must-change-password=false
ohdp.report.storage-dir=${BHFYZX_DATA_HOME}/storage/reports
# Generated DOCX requests field updates on open. Desktop operation must not
# depend on Word/WPS COM automation (which may leave documents locked).
ohdp.report.refresh-fields-on-windows=false
ohdp.reference-document.storage-dir=${BHFYZX_DATA_HOME}/storage/reference-documents
radiology.storage.base-dir=${BHFYZX_DATA_HOME}/storage/radiology
feedback.storage.base-dir=${BHFYZX_DATA_HOME}/storage/feedback
logging.file.name=${BHFYZX_DATA_HOME}/logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
