name: bhfyzx

services:
  db:
    image: mysql:8.4
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ohdp}
      MYSQL_USER: ${MYSQL_USER:-ohdp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 install.ps1 生成 .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 install.ps1 生成 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: bhfyzx-api:1.0.8
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-ohdp}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ohdp}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请先运行 install.ps1 生成 .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DSF_AUTH_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      DSF_AUTH_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?请先运行 install.ps1 生成 .env}
      OHDP_REPORT_STORAGE_DIR: /data/reports
      OHDP_REFERENCE_DOCUMENT_STORAGE_DIR: /data/reference-documents
      RADIOLOGY_STORAGE_DIR: /data/radiology
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - report_data:/data/reports
      - reference_document_data:/data/reference-documents
      - radiology_data:/data/radiology
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: bhfyzx-web:1.0.8
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  report_data:
  reference_document_data:
  radiology_data:
